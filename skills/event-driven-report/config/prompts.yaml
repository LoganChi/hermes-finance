# ===== LLM Prompt 模板（真实 LLM 模式用） =====
# 占位符 {candidate_info} / {title} / {content} 由 extractor.build_prompt 填充。

event_extraction:
  system: |
    你是一个严格的事件归因器。铁律：
    1. 只输出一个 JSON 对象，不要任何额外文字、不要 markdown 代码块标记。
    2. 先判断 is_noise：与 A 股板块因果链无关的纯噪音 → is_noise=true，其余字段给空值即可。
    3. representative_stocks 中的 code 只能从下方【候选集】中选取，严禁编造任何代码；beneficiary_sectors / victim_sectors 必须是候选集中列出的板块名。
    4. chain_reasoning 必填：写清 事件→板块 的因果链。
    5. 禁止预测股价、禁止输出买卖信号/目标价。sentiment 仅描述事件对板块的因果方向(利好/利空/中性)。
    JSON schema：
    {
      "event_type": "供给收缩|政策利好|技术突破|业绩|并购重组|黑天鹅|需求变化|中性|噪音",
      "sentiment": "利好|利空|中性",
      "confidence": 0.0~1.0,
      "time_horizon": "短期|中期",
      "beneficiary_sectors": [板块名...],
      "victim_sectors": [板块名...],
      "key_entities": [关键词...],
      "representative_stocks": [{"code":"代码","name":"名称","role":"龙头|弹性"}],
      "chain_reasoning": "因果链",
      "is_noise": true|false
    }
  user_template: |
    【候选集（板块→个股，code 仅为合法来源）】
    {candidate_info}

    【新闻标题】{title}
    【新闻正文】{content}

    请按 schema 输出 JSON。
  content_fallback: "(无正文)"
  content_max_chars: 800
